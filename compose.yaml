services:
  ollama:
    image: ollama/ollama:0.34.1
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
  model-pull:
    image: ollama/ollama:0.34.1
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "qwen3:4b"]
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:4b
      AMES_LLM_ENABLED: "true"
      AMES_LLM_TIMEOUT_SECONDS: "300"
    depends_on:
      model-pull:
        condition: service_completed_successfully
    volumes:
      - housing-artifacts:/app/artifacts
volumes:
  ollama-models:
  housing-artifacts:

name: MLOps validation

on:
  workflow_dispatch:
  push:
    branches: [main, capstone-llm-interface]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONHASHSEED: "42"
  DVC_NO_ANALYTICS: "true"

jobs:
  test:
    name: Validate data and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # These action versions use Node 24, the supported GitHub runner runtime.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Restore versioned dataset
        run: |
          python -m src.data_storage bootstrap
          dvc pull
      - name: Run complete test suite
        run: python -m pytest tests/ -v --junitxml=artifacts/test-results.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results.xml

  train:
    name: Train and enforce performance gates
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Restore versioned dataset
        run: |
          # Jobs use separate machines, so training restores its own verified data.
          python -m src.data_storage bootstrap
          dvc pull
      - name: Train selected configuration and enforce gates
        run: python -m src.train --experiment-name ames-housing-ci
      - name: Preserve training evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: training-evidence
          path: artifacts/
          retention-days: 30

  container:
    name: Build and smoke-test app container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build inference image
        run: docker build -t ames-capstone:ci .
      - name: Run app and verify actual released model
        run: |
          docker run -d --name ames-ci -p 127.0.0.1:8501:8501 -e AMES_LLM_ENABLED=false ames-capstone:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8501/_stcore/health
          docker exec ames-ci python -c "from src.serving import load_serving_model,predict; from src.interface import SAMPLE_FEATURES; m,meta=load_serving_model(); p=predict(m,meta,SAMPLE_FEATURES); assert 10000 < p < 1000000; print('Released model prediction:',p)"
      - name: Container logs
        if: always()
        run: docker logs ames-ci || true

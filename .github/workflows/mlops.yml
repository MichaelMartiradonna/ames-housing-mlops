name: MLOps validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONHASHSEED: "42"
  DVC_NO_ANALYTICS: "true"

jobs:
  test:
    name: Validate data and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Restore versioned dataset
        run: |
          python -m src.data_storage bootstrap
          dvc pull
      - name: Run complete test suite
        run: python -m pytest tests/ -v --junitxml=artifacts/test-results.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results.xml

  train:
    name: Train and enforce performance gates
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Restore versioned dataset
        run: |
          python -m src.data_storage bootstrap
          dvc pull
      - name: Train selected configuration and enforce gates
        run: python -m src.train --experiment-name ames-housing-ci
      - name: Preserve training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-evidence
          path: artifacts/
          retention-days: 30
